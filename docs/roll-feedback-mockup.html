<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahdle — same-face re-roll feedback</title>
<style>
  :root {
    --bg: #120a24;
    --card: #1a1130;
    --edge: #2d1b55;
    --edge-hi: #4a2d80;
    --ink: #f4efff;
    --dim: #a690d6;
    --purple: #7c3aed;
    --purple-hi: #9061f9;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 14px 60px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
  .sub code { background: #00000040; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab {
    font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    padding: 7px 11px; border-radius: 999px;
    background: transparent; color: var(--dim);
    border: 1px solid var(--edge-hi);
  }
  .tab[aria-selected="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }

  .card {
    background: var(--card); border: 1px solid var(--edge);
    border-radius: 14px; padding: 12px; margin-bottom: 12px;
  }
  .label { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); text-align: center; margin-bottom: 8px; }

  .rack { display: flex; justify-content: center; gap: 7px; margin-bottom: 12px; }
  .tile {
    position: relative; width: 46px; height: 46px; border-radius: 9px;
    display: grid; place-items: center;
    font: 700 21px/1 ui-serif, Georgia, serif;
    background: #fdfaff; color: #2a1758;
    border: 1px solid #d9c9f5;
    box-shadow: 0 2px 0 #00000038;
  }
  .tile .val { position: absolute; right: 3px; bottom: 2px; font: 600 9px/1 ui-sans-serif, sans-serif; opacity: .55; }
  .tile.empty, .tile.kept-dot {
    background: transparent; color: #6c58a0;
    border: 1px dashed var(--edge-hi); box-shadow: none;
  }
  .tile.kept-letter {
    background: #2a1c4d; color: #cbb6f5;
    border: 1px dashed rgba(245,158,11,.55); box-shadow: none;
  }
  .tile.kept-letter .val { opacity: .4; }
  .tile.flash { animation: flash 1.1s ease-out; }
  .tile.spin { animation: spin .5s ease-out; }
  @keyframes spin {
    0%   { transform: rotateX(0deg)   scale(1); }
    40%  { transform: rotateX(540deg) scale(.78); opacity: .7; }
    100% { transform: rotateX(1080deg) scale(1); opacity: 1; }
  }
  @keyframes flash {
    0%, 100% { box-shadow: 0 2px 0 #00000038; }
    18%      { box-shadow: 0 0 0 3px var(--amber), 0 2px 0 #00000038; }
    60%      { box-shadow: 0 0 0 3px var(--amber), 0 2px 0 #00000038; }
  }

  .controls { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 44px; }
  .roll {
    font: inherit; font-weight: 700; cursor: pointer; color: #fff;
    padding: 9px 20px; border-radius: 10px; border: 0;
    background: linear-gradient(180deg, var(--purple-hi), var(--purple));
    box-shadow: 0 2px 0 #00000050;
  }
  .roll:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .count { font-size: 12px; color: var(--dim); white-space: nowrap; }

  .note { min-height: 20px; text-align: center; font-size: 12.5px; margin-top: 8px; color: var(--amber); font-weight: 600; }
  .note:empty::after { content: "\00a0"; }

  .expl { font-size: 13px; color: var(--dim); border-left: 2px solid var(--edge-hi); padding: 2px 0 2px 11px; margin: 0 0 14px; }
  .expl b { color: var(--ink); }
  .replay { font: inherit; font-size: 12.5px; cursor: pointer; background: transparent; color: var(--dim); border: 1px solid var(--edge-hi); border-radius: 8px; padding: 6px 12px; display: block; margin: 0 auto; }
  .steps { font-size: 12px; color: var(--dim); text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Same-face re-roll: what the player sees</h1>
  <p class="sub">Real scenario, today's puzzle, turn 1. Roll 2 gives <code>TONCOW</code>. You keep 5 tiles, leaving one live die showing <code>O</code>. It re-rolls to <code>O</code> again. Press Roll and watch the rack.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="now" aria-selected="true">Today</button>
    <button class="tab" role="tab" data-v="letters">A · keep letters visible</button>
    <button class="tab" role="tab" data-v="callout">B · call out the repeat</button>
    <button class="tab" role="tab" data-v="both">A + B</button>
  </div>

  <p class="expl" id="expl"></p>

  <div class="card">
    <div class="label" id="rackLabel">Tap a die to move it into your word</div>
    <div class="rack" id="rack"></div>
    <div class="controls">
      <button class="roll" id="rollBtn">Re-roll</button>
      <span class="count" id="count">Roll 2/3</span>
    </div>
    <div class="note" id="note"></div>
  </div>

  <button class="replay" id="replay">↺ Reset to roll 2/3</button>
  <p class="steps" id="steps"></p>
</div>

<script>
  const VALUES = { A:1,E:1,I:1,O:1,U:1,N:1,R:1,T:1,L:1,S:1,D:2,G:2,B:3,C:3,M:3,P:3,H:4,W:4 };
  // Today's turn 1: roll2 = TONCOW, roll3 = EOMSEE. Only die index 1 is live,
  // and it holds O on both rolls — the collision this mockup is about.
  const FACES   = ['T','O','N','C','O','W'];
  const KEPT    = [true, false, true, true, true, true];
  const LIVE    = 1;
  const NEXT    = 'O';

  const EXPL = {
    now:      "<b>Today.</b> Kept dice render as a dot, so the whole rack is dots and one letter. The live die spins for half a second and lands on O again. Nothing on screen distinguishes this from a dead button, and the roll is gone.",
    letters:  "<b>Option A.</b> Kept dice keep showing their letter, dimmed with an amber dashed edge. The rack stays readable, so you can see your word forming and see exactly which die is still live. The repeat is still a repeat, but the board no longer looks blank.",
    callout:  "<b>Option B.</b> Keep the dots, but when a re-roll returns the same letters, say so. The die flashes amber and a line confirms the roll was used. No mistaking it for a dead button.",
    both:     "<b>A + B.</b> Kept letters stay visible and the repeat gets called out. Most informative; also the most visual change from today."
  };

  let variant = 'now';
  let rolled = false;

  const rack = document.getElementById('rack');
  const note = document.getElementById('note');
  const rollBtn = document.getElementById('rollBtn');
  const count = document.getElementById('count');
  const expl = document.getElementById('expl');
  const steps = document.getElementById('steps');

  function showLetters() { return variant === 'letters' || variant === 'both'; }
  function showCallout() { return variant === 'callout' || variant === 'both'; }

  function render(animate) {
    rack.innerHTML = '';
    FACES.forEach((f, i) => {
      const kept = KEPT[i];
      const el = document.createElement('div');
      const face = (i === LIVE && rolled) ? NEXT : f;
      if (kept) {
        el.className = 'tile ' + (showLetters() ? 'kept-letter' : 'kept-dot');
        el.textContent = showLetters() ? face : '·';
        if (showLetters()) el.insertAdjacentHTML('beforeend', `<span class="val">${VALUES[face]}</span>`);
      } else {
        el.className = 'tile';
        el.textContent = face;
        el.insertAdjacentHTML('beforeend', `<span class="val">${VALUES[face]}</span>`);
        if (animate) el.classList.add('spin');
        if (animate && showCallout()) el.classList.add('flash');
      }
      rack.appendChild(el);
    });
    count.textContent = rolled ? 'Roll 3/3' : 'Roll 2/3';
    rollBtn.disabled = rolled;
    steps.textContent = rolled
      ? 'Roll spent. Rack letters are identical to before.'
      : 'Five tiles kept. One live die showing O.';
  }

  function reset() {
    rolled = false;
    note.textContent = '';
    render(false);
  }

  rollBtn.addEventListener('click', () => {
    rolled = true;
    render(true);
    note.textContent = showCallout() ? 'Same letter — roll 3 of 3 used.' : '';
  });

  document.getElementById('replay').addEventListener('click', reset);

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', 'false'));
      t.setAttribute('aria-selected', 'true');
      variant = t.dataset.v;
      expl.innerHTML = EXPL[variant];
      reset();
    });
  });

  expl.innerHTML = EXPL.now;
  reset();
</script>
</body>
</html>
